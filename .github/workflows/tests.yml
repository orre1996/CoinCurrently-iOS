name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  tests:
    name: CoinCurrentlyTests
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      # xcodebuild block-buffers when GitHub Actions is not a terminal, so the
      # log sits on the last short line while the build continues.
      NSUnbufferedIO: YES
    steps:
      - uses: actions/checkout@v4

      - name: Add placeholder secrets
        run: cp Config/Secrets.example.plist Config/Secrets.plist

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('CoinCurrently.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Run tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))

          def runtime_version(runtime, prefix):
              match = re.search(rf"{prefix}-(\d+)-(\d+)", runtime)
              if not match:
                  return None
              return tuple(int(part) for part in match.groups())

          phones = []
          for runtime, devices in data.get("devices", {}).items():
              ios = runtime_version(runtime, "iOS")
              if not ios:
                  continue
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  name = device.get("name", "")
                  udid = device.get("udid")
                  if name.startswith("iPhone"):
                      phones.append((ios, name, udid))
          if not phones:
              sys.exit("No available iPhone simulator")
          numbered = [phone for phone in phones if re.match(r"iPhone \d", phone[1])]
          pool = numbered or phones
          pool.sort()
          version, name, udid = pool[-1]
          print(f"Using simulator {name} (iOS {version[0]}.{version[1]})", file=sys.stderr)
          with open("simulator-id.txt", "w", encoding="utf-8") as handle:
              handle.write(udid)
          PY
          UDID="$(cat simulator-id.txt)"
          xcrun simctl shutdown all || true
          # The runner image already pairs this phone with a watch. Booting another
          # watch hits the pairing limit and competes with the phone during migration.
          # Boot in the background so CoreLocation migration overlaps the compile.
          # The simulator is only required once the test host is installed.
          xcrun simctl boot "$UDID" >/tmp/sim-boot.log 2>&1 || true &
          BOOT_PID=$!
          # Drop restored workspace state so checkouts are reused without stale paths.
          rm -f SourcePackages/workspace-state.json
          # Xcode 26 precompiles explicit Clang modules right after the package
          # Info.plist steps. That phase is what follows GoogleUtilities-Environment
          # and consumes the rest of a clean build. Package targets compile faster
          # without it.
          defaults write com.apple.dt.XCBuild EnableSwiftExplicitModules -bool NO
          # Exit 74 means Swift package resolution failed. Hosted runners sometimes
          # cannot reach github.com:443 while cloning Firebase and its dependencies.
          for attempt in 1 2 3; do
            if xcodebuild build-for-testing \
              -project CoinCurrently.xcodeproj \
              -scheme CoinCurrentlyTests \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath "$PWD/DerivedData" \
              -clonedSourcePackagesDirPath "$PWD/SourcePackages" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              DEVELOPMENT_TEAM="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              SWIFT_ENABLE_EXPLICIT_MODULES=NO
            then
              break
            fi
            status=$?
            if [[ "$status" -ne 74 || "$attempt" -eq 3 ]]; then
              exit "$status"
            fi
            echo "Package resolution could not reach GitHub (attempt ${attempt}). Retrying."
            sleep $((attempt * 10))
          done
          wait "$BOOT_PID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test-without-building \
            -project CoinCurrently.xcodeproj \
            -scheme CoinCurrentlyTests \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$PWD/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
